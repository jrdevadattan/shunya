[package]
name = "recovery-daemon"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "recoveryd"
path = "src/main.rs"

[dependencies]
carving = { path = "../carving" }
case-store = { path = "../case-store" }
exporter = { path = "../exporter" }
fs2.workspace = true
image-io = { path = "../image-io" }
job-engine = { path = "../job-engine" }
partition-scan = { path = "../partition-scan" }
recovery-ipc = { path = "../recovery-ipc" }
recovery-domain = { path = "../recovery-domain" }
reporting = { path = "../reporting" }
result-index = { path = "../result-index" }
safety-policy = { path = "../safety-policy" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
source-inventory = { path = "../source-inventory" }
threat-scan = { path = "../threat-scan" }
tokio.workspace = true
tokio-util.workspace = true
tool-runner = { path = "../tool-runner" }
uuid.workspace = true
validation = { path = "../validation" }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Security", "Win32_System_IO", "Win32_System_Ioctl"] }

[dev-dependencies]
tempfile = "3"
