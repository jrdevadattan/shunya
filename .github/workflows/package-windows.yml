name: Package Windows

on:
  workflow_dispatch:
  push:
    branches: [dev]
    tags: ['v*']

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
        with: { toolchain: 1.98.0 }
      - run: corepack enable && corepack pnpm install --frozen-lockfile
      - run: cargo build --workspace --release --locked
      - run: corepack pnpm --filter @recovery/desktop make
        env:
          RECOVERY_RELEASE_BUILD: '1'
          WINDOWS_CERTIFICATE_FILE: ${{ secrets.WINDOWS_CERTIFICATE_FILE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      - name: Verify package contents and fuses
        run: corepack pnpm --filter @recovery/desktop exec tsx ../../packaging/scripts/verify-package.ts "out/SIH Recovery Platform-win32-x64"
        working-directory: apps/desktop
      - uses: actions/upload-artifact@v4
        with:
          name: recovery-platform-windows-x64
          path: apps/desktop/out/make/**/*
          if-no-files-found: error
