name: Publish Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
        with: { toolchain: 1.98.0 }
      - run: corepack pnpm install --frozen-lockfile
      - run: cargo build --workspace --release --locked
      - name: Prepare optional Windows signing certificate
        shell: pwsh
        env: { CERTIFICATE_BASE64: '${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}' }
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CERTIFICATE_BASE64)) {
            Write-Host 'Windows signing certificate is not configured; producing an unsigned artifact.'
            exit 0
          }
          $certificate = Join-Path $env:RUNNER_TEMP 'recovery-signing.pfx'
          [IO.File]::WriteAllBytes($certificate, [Convert]::FromBase64String($env:CERTIFICATE_BASE64))
          "WINDOWS_CERTIFICATE_FILE=$certificate" | Out-File -FilePath $env:GITHUB_ENV -Append
      - run: corepack pnpm --filter @recovery/desktop make
        env:
          RECOVERY_RELEASE_BUILD: '1'
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      - run: corepack pnpm --filter @recovery/desktop exec tsx ../../packaging/scripts/verify-package.ts "out/SIH Recovery Platform-win32-x64"
        working-directory: apps/desktop
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows-x64
          path: |
            apps/desktop/out/make/**/*.exe
            apps/desktop/out/make/**/*.nupkg
          if-no-files-found: error

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
        with: { toolchain: 1.98.0 }
      - run: sudo apt-get update && sudo apt-get install -y fakeroot dpkg rpm
      - run: corepack pnpm install --frozen-lockfile
      - run: cargo build --workspace --release --locked
      - run: corepack pnpm --filter @recovery/desktop make
        env: { RECOVERY_RELEASE_BUILD: '1' }
      - run: corepack pnpm --filter @recovery/desktop exec tsx ../../packaging/scripts/verify-package.ts "out/SIH Recovery Platform-linux-x64"
        working-directory: apps/desktop
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-x64
          path: apps/desktop/out/make/**/*.deb
          if-no-files-found: error

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
        with: { toolchain: 1.98.0 }
      - run: corepack pnpm install --frozen-lockfile
      - run: cargo build --workspace --release --locked
      - run: corepack pnpm --filter @recovery/desktop make
        env:
          RECOVERY_RELEASE_BUILD: '1'
          MAC_CODESIGN_IDENTITY: ${{ secrets.MAC_CODESIGN_IDENTITY }}
      - run: corepack pnpm --filter @recovery/desktop exec tsx ../../packaging/scripts/verify-package.ts "out/SIH Recovery Platform-darwin-${{ matrix.arch }}"
        working-directory: apps/desktop
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos-${{ matrix.arch }}
          path: |
            apps/desktop/out/make/**/*.dmg
            apps/desktop/out/make/**/*.zip
          if-no-files-found: error

  rescue:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
        with: { toolchain: 1.98.0 }
      - run: sudo apt-get update && sudo apt-get install -y live-build fakeroot dpkg rpm
      - run: corepack pnpm install --frozen-lockfile
      - run: cargo build --workspace --release --locked
      - run: corepack pnpm --filter @recovery/desktop make
      - name: Stage and build Rescue ISO
        env: { RECOVERY_VERSION: '${{ github.ref_name }}' }
        run: |
          mkdir -p live/config/includes.chroot/opt/recovery/staging
          cp "$(find apps/desktop/out/make -name '*.deb' -print -quit)" live/config/includes.chroot/opt/recovery/staging/
          cp target/release/recovery-privileged-helper live/config/includes.chroot/opt/recovery/staging/
          sh live/scripts/verify-live.sh
          sh live/scripts/build-live.sh
      - uses: actions/upload-artifact@v4
        with:
          name: release-rescue-x64
          path: dist/rescue/*
          if-no-files-found: error

  publish:
    needs: [windows, linux, macos, rescue]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: downloaded }
      - name: Assemble checksums and canonical manifest
        run: |
          mkdir publish
          find downloaded -type f \( -name '*.exe' -o -name '*.nupkg' -o -name '*.deb' -o -name '*.dmg' -o -name '*.zip' -o -name '*.iso' -o -name '*.iso.sha256' -o -name '*.manifest.json' \) -exec cp {} publish/ \;
          cd publish
          sha256sum * > SHA256SUMS
          python3 - <<'PY'
          import hashlib, json, pathlib
          files=[]
          for path in sorted(pathlib.Path('.').iterdir()):
              if path.is_file() and path.name != 'release-manifest.json':
                  data=path.read_bytes(); files.append({'name':path.name,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()})
          pathlib.Path('release-manifest.json').write_text(json.dumps({'schemaVersion':1,'tag':'${{ github.ref_name }}','files':files},indent=2)+'\n')
          PY
      - uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: publish/*
          fail_on_unmatched_files: true
