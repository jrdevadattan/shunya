name: Package macOS

on:
  workflow_dispatch:
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  macos-arm64:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
        with: { toolchain: 1.98.0 }
      - run: corepack enable && corepack pnpm install --frozen-lockfile
      - run: cargo build --workspace --release --locked
      - run: corepack pnpm --filter @recovery/desktop make
        env:
          RECOVERY_RELEASE_BUILD: '1'
          MAC_CODESIGN_IDENTITY: ${{ secrets.MAC_CODESIGN_IDENTITY }}
      - name: Verify package contents and fuses
        run: corepack pnpm --filter @recovery/desktop exec tsx ../../packaging/scripts/verify-package.ts "out/SIH Recovery Platform-darwin-arm64"
        working-directory: apps/desktop
      - uses: actions/upload-artifact@v4
        with:
          name: recovery-platform-macos-arm64
          path: apps/desktop/out/make/**/*
          if-no-files-found: error
